# ═══════════════════════════════════════════════════════════════════════
# Reusable workflow: Build → Scan → Push → Promote
# Location: Coflnet/.github/.github/workflows/container-ci.yml
#
# SECURITY:
# - This file lives in a protected repo. Callers cannot modify it.
# - Image name is derived from repo name, MUST use muehlhansfl/ namespace.
# - Registry credentials are stored in THIS repo only — callers never
#   pass them. A compromised caller repo cannot exfiltrate tokens.
# - Scan gates push: no push if Trivy finds HIGH+ CVEs.
# ═══════════════════════════════════════════════════════════════════════

name: Container CI

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: "./Dockerfile"
      context:
        type: string
        default: "."
      platforms:
        type: string
        default: "linux/amd64"
      severity_threshold:
        type: string
        default: "HIGH"
      k8s_file:
        type: string
        default: ""
        description: "Path in Coflnet/k8s to update (e.g. main/sky/chart/charts/sky-proxy/values.yaml)"
      k8s_image_key:
        type: string
        default: "image.tag"
        description: "YAML key path to update"

# NOTE: No 'secrets:' declared. Registry credentials live in
# THIS repo (Coflnet/.github → Settings → Secrets).
# Caller workflows CANNOT access them.

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD: No secrets. No registry access. Just build and export.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      # Single tag for Trivy scan (needs exactly one reference)
      image_single: ${{ steps.first-tag.outputs.tag }}
      # All tags for docker push
      image_tags: ${{ steps.meta.outputs.tags }}
      artifact_name: image-${{ github.sha }}
    permissions:
      contents: read             # only needed for checkout
      packages: read             # for ghcr.io image pulls if any

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name
        id: image
        run: |
          # SECURITY: image name is DERIVED. Caller cannot override.
          # Must use muehlhansfl/ namespace — same as Argo template check.
          REPO_LOWER="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=docker.io/muehlhansfl/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Extract first tag for scan reference
        id: first-tag
        run: |
          # metadata outputs multiple tags (short sha + branch name).
          # Trivy needs a single image reference — use the first one.
          echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build and export tarball
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          # Export to tarball — NO push to registry here.
          # This isolates registry credentials from the build.
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ github.sha }}
          path: /tmp/image.tar
          retention-days: 1  # short-lived — only needed for scan + push

  # ═══════════════════════════════════════════════════════════════════
  # SCAN: Trivy vulnerability scan. Gates the push step.
  # ═══════════════════════════════════════════════════════════════════
  scan:
    name: Scan
    runs-on: ubuntu-latest
    needs: build
    outputs:
      passed: ${{ steps.scan.outcome == 'success' }}
    permissions:
      contents: read
      security-events: write   # for SARIF upload

    steps:
      - name: Checkout (for Dockerfile context in SARIF)
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: /tmp

      - name: Load image into Docker
        run: docker load --input /tmp/image.tar

      - name: Scan for vulnerabilities
        id: scan
        uses: crazy-max/ghaction-container-scan@v4
        with:
          image: ${{ needs.build.outputs.image_single }}
          dockerfile: ${{ inputs.dockerfile }}
          severity_threshold: ${{ inputs.severity_threshold }}
          annotations: true

      - name: Upload SARIF to GitHub Security
        if: steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # ═══════════════════════════════════════════════════════════════════
  # PUSH: Docker Hub. Only if scan passed. Credentials live in
  # Coflnet/.github repo secrets — callers NEVER see them.
  # ═══════════════════════════════════════════════════════════════════
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: needs.scan.result == 'success'
    permissions: {}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: /tmp

      - run: docker load --input /tmp/image.tar

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker push ${{ needs.build.outputs.image_tags }}

  # ═══════════════════════════════════════════════════════════════════
  # PROMOTE: Update k8s deployment in Coflnet/k8s after push.
  # Equivalent to the Argo promoter: edits YAML, commits, opens PR.
  # ═══════════════════════════════════════════════════════════════════
  promote:
    name: Promote
    runs-on: ubuntu-latest
    needs: [push]
    if: inputs.k8s_file != ''
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Coflnet/k8s
          token: ${{ secrets.K8S_PAT }}
          path: k8s

      - name: Update image tag
        working-directory: k8s
        run: |
          FILE="${{ inputs.k8s_file }}"
          KEY="${{ inputs.k8s_image_key }}"
          TAG="${{ github.sha }}"

          if [ ! -f "$FILE" ]; then
            echo "::error::Deployment file not found: $FILE"
            exit 1
          fi

          echo "Before:"
          grep -A2 'image:' "$FILE" | head -5

          yq eval ".${KEY} = \"${TAG}\"" -i "$FILE"

          echo "After:"
          grep -A2 'image:' "$FILE" | head -5

      - uses: peter-evans/create-pull-request@v7
        with:
          path: k8s
          commit-message: "chore(${{ github.event.repository.name }}): deploy ${{ github.sha }}"
          branch: "promote/${{ github.event.repository.name }}-${{ github.sha }}"
          title: "🚀 Deploy ${{ github.event.repository.name }} @ ${{ github.sha }}"
          body: |
            Automated promotion after successful build + scan.

            - **Image**: `${{ needs.build.outputs.image_tags }}`
            - **Source**: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            - **Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          delete-branch: true
