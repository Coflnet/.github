# ═══════════════════════════════════════════════════════════════════════
# Reusable workflow: Build → Push to GHCR → Signal Argo via OIDC webhook
# Location: Coflnet/.github/.github/workflows/container-ci.yml
#
# SECURITY MODEL (defense in depth):
# 1. Build runs on GitHub's ephemeral runners — NO cluster access.
# 2. Image pushed to ghcr.io/coflnet/<repo> — private by default,
#    readable only by the cluster's ghcr-read token (OpenBao).
# 3. GitHub mints a cryptographically signed OIDC JWT (RS256) and
#    POSTs it to Argo Events. An attacker cannot forge the JWT
#    because they don't have GitHub's private signing key.
# 4. Argo verifies the JWT against GitHub's JWKS, extracts the
#    authenticated `repository` claim, and cross-checks it against
#    the pull request. The webhook body is NOT trusted alone.
# 5. Trivy scan runs INSIDE the cluster (authoritative gate) before
#    the image is promoted to Docker Hub. No Docker Hub creds exist
#    on GitHub runners.
#
# SECRETS: Build-time secrets (NuGet, HuggingFace, Nuxt license) are
# stored as ORGANIZATION secrets in the Coflnet org. Caller workflows
# do NOT pass them — they are resolved automatically. Docker Hub
# credentials NEVER touch GitHub runners.
# ═══════════════════════════════════════════════════════════════════════

name: Container CI

on:
  workflow_call:
    secrets:
      ARGO_WEBHOOK_SECRET:
        required: true
        description: "HMAC secret shared with Argo Events for webhook validation"
    inputs:
      dockerfile:
        type: string
        default: "./Dockerfile"
        description: "Path to Dockerfile, relative to the context directory"
      context:
        type: string
        default: "."
        description: "Build context directory (git repo is pre-checked-out)"
      platforms:
        type: string
        default: "linux/amd64"
      k8s_file:
        type: string
        default: ""
        description: "Path in Coflnet/k8s to update (e.g. main/sky/chart/charts/sky-proxy/values.yaml). Empty = skip promotion."
      k8s_image_key:
        type: string
        default: "image.tag"
        description: "YAML key path to update"
      repo_url:
        type: string
        default: "https://github.com/Coflnet/fleet"
        description: "GitOps repo where tag is committed — Coflnet/fleet or Coflnet/k8s"
      # ── Optional: override the default branch tag ──
      branch_tag:
        type: string
        default: ""
        description: "Branch name for GHCR tag (defaults to github.ref_name)"

# Build-time credentials (NuGet, HF, Nuxt) are Coflnet org secrets.
# ARGO_WEBHOOK_SECRET is HMAC shared with Argo Events — public repos
# get it via org secret, private repos pass it explicitly.
# Docker Hub credentials NEVER touch GitHub runners.

permissions:
  id-token: write   # Required for core.getIDToken() → OIDC JWT
  packages: write   # Required for docker push to ghcr.io
  contents: read    # Required for actions/checkout

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD & PUSH to GHCR
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build & Push GHCR
    runs-on: ubuntu-latest
    outputs:
      ghcr_image: ${{ steps.ghcr-tag.outputs.image }}
      ghcr_tag_sha: ${{ steps.ghcr-tag.outputs.tag_sha }}
      ghcr_tag_branch: ${{ steps.ghcr-tag.outputs.tag_branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name and tags
        id: ghcr-tag
        run: |
          # Image: ghcr.io/<owner>/<repo-lowercase>
          REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LOWER}"
          TAG_SHA="${{ github.sha }}"
          TAG_BRANCH="${{ inputs.branch_tag || github.ref_name }}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_branch=${TAG_BRANCH}" >> "$GITHUB_OUTPUT"

          echo "::notice::Building ${IMAGE}:${TAG_SHA} (branch: ${TAG_BRANCH})"

      - name: Inject NODE_USE_ENV_PROXY into Dockerfile
        run: |
          # Replicates the in-cluster Buildah behavior: inject
          # ARG + ENV NODE_USE_ENV_PROXY after every FROM line so
          # all build stages get proxy-aware Node.js resolution.
          mkdir -p /tmp/ci-dockerfile
          awk '
            /^[[:space:]]*FROM[[:space:]]/ {
              print
              print "ARG NODE_USE_ENV_PROXY=1"
              print "ENV NODE_USE_ENV_PROXY=${NODE_USE_ENV_PROXY}"
              next
            }
            { print }
          ' "${{ inputs.dockerfile }}" > /tmp/ci-dockerfile/Dockerfile
          echo "::notice::Injected NODE_USE_ENV_PROXY after FROM lines"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: /tmp/ci-dockerfile/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ steps.ghcr-tag.outputs.image }}:${{ steps.ghcr-tag.outputs.tag_sha }}
            ${{ steps.ghcr-tag.outputs.image }}:${{ steps.ghcr-tag.outputs.tag_branch }}
          build-args: |
            NODE_USE_ENV_PROXY=1
            NUGET_USERNAME=${{ secrets.NUGET_USERNAME }}
            NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}
            NUXT_UI_PRO_LICENSE=${{ secrets.NUXT_UI_PRO_LICENSE }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # ═══════════════════════════════════════════════════════════════════
  # SIGNAL: Request OIDC JWT and webhook Argo Events
  # ═══════════════════════════════════════════════════════════════════
  signal:
    name: Signal Argo
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # needed for core.getIDToken()

    steps:
      - name: Derive Docker Hub image name
        id: image
        run: |
          REPO_LOWER="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=muehlhansfl/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Request OIDC token from GitHub
        id: token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("https://argo-promote.coflnet.com");
            core.setOutput("id_token", token);

      - name: Send promotion webhook to Argo Events
        env:
          ARGO_WEBHOOK_SECRET: ${{ secrets.ARGO_WEBHOOK_SECRET }}
        run: |
          # SECURITY: repo_url MUST be one of the two allowed promotion targets.
          # This prevents a compromised caller repo from redirecting promotions
          # to an arbitrary Coflnet repository.
          case "${{ inputs.repo_url }}" in
            https://github.com/Coflnet/k8s|https://github.com/Coflnet/fleet) ;;
            *) echo "::error::repo_url must be Coflnet/k8s or Coflnet/fleet, got: ${{ inputs.repo_url }}"; exit 1 ;;
          esac
          # Build the webhook payload. The `token` is the OIDC JWT that
          # Argo will verify against GitHub's JWKS. The `repository` and
          # `sha` fields are cross-checked against verified JWT claims.
          PAYLOAD="$(jq -nc \
            --arg token "${{ steps.token.outputs.id_token }}" \
            --arg repository "${{ github.repository }}" \
            --arg sha "${{ github.sha }}" \
            --arg image_name "${{ steps.image.outputs.name }}" \
            --arg ghcr_image "${{ needs.build.outputs.ghcr_image }}" \
            --arg ghcr_tag "${{ needs.build.outputs.ghcr_tag_sha }}" \
            --arg k8s_file "${{ inputs.k8s_file }}" \
            --arg k8s_image_key "${{ inputs.k8s_image_key }}" \
            --arg repo_url "${{ inputs.repo_url }}" \
            --arg branch "${{ inputs.branch_tag || github.ref_name }}" \
            '{
              token: $token,
              repository: $repository,
              sha: $sha,
              image_name: $image_name,
              ghcr_image: $ghcr_image,
              ghcr_tag: $ghcr_tag,
              k8s_file: $k8s_file,
              k8s_image_key: $k8s_image_key,
              repo_url: $repo_url,
              branch: $branch
            }')"

          # Compute HMAC-SHA256 signature — Argo Events validates this
          # against the shared webhook secret before creating any workflow.
          HMAC="$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$ARGO_WEBHOOK_SECRET" | sed 's/^.* //')"

          echo "::notice::Signaling Argo for ${REPO_LOWER} @ ${{ github.sha }}"

          curl -fsS -X POST \
            "https://argo-events.coflnet.com/github-promote" \
            -H "X-Hub-Signature-256: sha256=${HMAC}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

  # ═══════════════════════════════════════════════════════════════════
  # CLEANUP: Keep ≤2 recent images + 2-day TTL on all versions
  # ═══════════════════════════════════════════════════════════════════
  cleanup:
    name: Expire old GHCR images
    runs-on: ubuntu-latest
    needs: [build, signal]
    if: always() && needs.build.result != 'skipped'
    permissions:
      packages: write

    steps:
      - name: Delete stale GHCR versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_TAG: ${{ needs.build.outputs.ghcr_tag_branch }}
        run: |
          REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          OWNER="${REPO_LOWER%%/*}"
          PACKAGE="${REPO_LOWER##*/}"
          CUTOFF="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"

          echo "::notice::Cleaning ghcr.io/${REPO_LOWER}"
          echo "::notice::  TTL cutoff:  ${CUTOFF}"
          echo "::notice::  Policy:      keep branch-tagged version; delete everything else older than cutoff"

          # Fetch versions; gracefully skip if the package doesn't exist yet.
          VERSIONS_JSON="$(gh api -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" 2>/dev/null || echo '[]')"

          # Selection logic (jq):
          #   A version is DELETED when BOTH are true:
          #     a) It does NOT carry the current branch tag (live pointer).
          #     b) It is older than the 2-day TTL cutoff.
          #   Rank-based capping is deliberately NOT used here — untagged
          #   platform manifests (children of a tagged manifest list) must
          #   survive alongside their parent or the image breaks.
          #   Relying purely on the TTL gives every version ≥2 days of life,
          #   which is ample for the Argo promotion pipeline.
          echo "${VERSIONS_JSON}" | jq -r --arg cutoff "${CUTOFF}" --arg branch "${BRANCH_TAG}" \
            'sort_by(.created_at) | reverse
             | map(select(
                 (.metadata.container.tags | index($branch) == null)
                 and
                 (.created_at < $cutoff)
               ))
             | .[] | "\(.id) \(.metadata.container.tags | join(","))"' \
            | while read -r VID TAGS; do
              echo "::warning::Expiring version ${VID} (tags: ${TAGS:-untagged})"
              gh api --silent -X DELETE \
                -H "Accept: application/vnd.github+json" \
                "/orgs/${OWNER}/packages/container/${PACKAGE}/versions/${VID}" || true
            done

          echo "::notice::GHCR cleanup complete"
