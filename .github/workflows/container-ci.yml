# ═══════════════════════════════════════════════════════════════════════
# Reusable workflow: Build → Scan → Push → Promote
# Location: Coflnet/.github/.github/workflows/container-ci.yml
#
# SECURITY: This file lives in a protected repo. Contributors to other
# repos CANNOT modify it. The image name is derived from the repo name
# — callers cannot redirect builds to a different image.
# ═══════════════════════════════════════════════════════════════════════

name: Container CI

on:
  workflow_call:
    inputs:
      # ── Optional build configuration ──
      dockerfile:
        type: string
        default: "./Dockerfile"
        description: "Path to Dockerfile relative to repo root"
      context:
        type: string
        default: "."
        description: "Docker build context path"
      platforms:
        type: string
        default: "linux/amd64"
        description: "Target platforms (comma-separated)"
      severity_threshold:
        type: string
        default: "HIGH"
        description: "Trivy severity threshold (LOW, MEDIUM, HIGH, CRITICAL)"
      # ── Optional: promotion (fleet deployment update) ──
      fleet_repo:
        type: string
        default: ""
        description: "If set, update image tag in this Fleet repo (org/repo)"
      fleet_path:
        type: string
        default: ""
        description: "Path within fleet repo to update (e.g. sky/sky-main.yaml)"
      fleet_image_key:
        type: string
        default: "image.tag"
        description: "YAML key path to update (dot-separated, e.g. image.tag)"
    secrets:
      ghcr_username:
        required: true
        description: "GitHub Container Registry username"
      ghcr_token:
        required: true
        description: "GitHub Container Registry token (PAT with write:packages)"
      fleet_pat:
        required: false
        description: "PAT for Fleet repo access (only needed if fleet_repo is set)"

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD: No secrets. No registry access. Just build and export.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
      artifact_name: image-${{ github.sha }}
    permissions:
      contents: read             # only needed for checkout
      packages: read             # for ghcr.io image pulls if any

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Derive image name from repo
        id: image
        run: |
          # SECURITY: image name is DERIVED, not configurable by caller.
          # A compromised contributor cannot redirect builds to another image.
          REPO_LOWER="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and export tarball
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          # Export to tarball — NO push to registry here.
          # This isolates registry credentials from the build.
          outputs: type=docker,dest=/tmp/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: image-${{ github.sha }}
          path: /tmp/image.tar
          retention-days: 1  # short-lived — only needed for scan + push

  # ═══════════════════════════════════════════════════════════════════
  # SCAN: Trivy vulnerability scan. Gates the push step.
  # ═══════════════════════════════════════════════════════════════════
  scan:
    name: Scan
    runs-on: ubuntu-latest
    needs: build
    outputs:
      passed: ${{ steps.scan.outcome == 'success' }}
    permissions:
      contents: read
      security-events: write   # for SARIF upload

    steps:
      - name: Checkout (for Dockerfile context in SARIF)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf7179ad29e24c73b5e93e7f522ea44c  # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: /tmp

      - name: Load image into Docker
        run: docker load --input /tmp/image.tar

      - name: Scan for vulnerabilities
        id: scan
        uses: crazy-max/ghaction-container-scan@3d72b4a567d7bfbad82d4e22460c5b3f5ebd7c2c  # v4.0.0
        with:
          image: ${{ needs.build.outputs.image_ref }}
          dockerfile: ${{ inputs.dockerfile }}
          severity_threshold: ${{ inputs.severity_threshold }}
          annotations: true

      - name: Upload SARIF to GitHub Security
        if: steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@1f494c3b3d2c7ef79279753b6d5bb89e14db36be  # v3.28.20
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # ═══════════════════════════════════════════════════════════════════
  # PUSH: Only runs if scan passed. Registry credentials live here.
  # ═══════════════════════════════════════════════════════════════════
  push:
    name: Push
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: needs.scan.result == 'success'
    # Optional: require manual approval before push
    # environment: registry-push
    permissions: {}  # no extra permissions needed

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf7179ad29e24c73b5e93e7f522ea44c  # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b44f367a81161e363641408b11bf5  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ secrets.ghcr_username }}
          password: ${{ secrets.ghcr_token }}

      - name: Push image
        run: |
          docker push ${{ needs.build.outputs.image_ref }}

  # ═══════════════════════════════════════════════════════════════════
  # PROMOTE: Optional — update Fleet deployment after successful push.
  # Only runs if fleet_repo input is provided.
  # ═══════════════════════════════════════════════════════════════════
  promote:
    name: Promote
    runs-on: ubuntu-latest
    needs: [push]
    if: inputs.fleet_repo != '' && inputs.fleet_path != ''
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Fleet repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ inputs.fleet_repo }}
          token: ${{ secrets.fleet_pat }}
          path: fleet

      - name: Update image tag
        id: update
        working-directory: fleet
        run: |
          FILE="${{ inputs.fleet_path }}"
          KEY="${{ inputs.fleet_image_key }}"
          TAG="${{ github.sha }}"

          if [ ! -f "$FILE" ]; then
            echo "::error::Fleet file not found: $FILE"
            exit 1
          fi

          # Update the image tag using yq (installed on ubuntu-latest)
          yq eval ".${KEY} = \"${TAG}\"" -i "$FILE"

          echo "Updated ${KEY} to ${TAG} in ${FILE}"
          cat "$FILE"

      - name: Create promotion PR
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e  # v7.0.8
        with:
          path: fleet
          commit-message: "chore(${{ github.event.repository.name }}): deploy image ${{ github.sha }}"
          branch: "promote/${{ github.event.repository.name }}-${{ github.sha }}"
          title: "🚀 Deploy ${{ github.event.repository.name }} @ ${{ github.sha }}"
          body: |
            Automated promotion after successful build + scan.

            - **Image**: `${{ needs.build.outputs.image_ref }}`
            - **Commit**: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            - **Workflow**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          delete-branch: true
